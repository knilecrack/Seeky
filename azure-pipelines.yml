trigger:
  - main
  - master

jobs:
- job: Build
  strategy:
    matrix:
      Windows:
        imageName: 'windows-latest'
        targetFlag: 'win32-x64'
      Linux:
        imageName: 'ubuntu-latest'
        targetFlag: 'linux-x64'
  pool:
    vmImage: $(imageName)

  steps:
  - task: UseNode@1
    inputs:
      version: '20.x'
    displayName: 'Install Node.js'

  - script: |
      npm ci
    displayName: 'Install dependencies'

  - script: |
      npm run compile
    displayName: 'Run Type Checks'

  - script: |
      BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
      npm version "$BASE.$(Build.BuildId)" --no-git-tag-version
      echo "Publishing version: $(node -p "require('./package.json').version")"
    displayName: 'Set CI version (major.minor.BuildId)'

  - script: |
      npx vsce package --target $(targetFlag)
    displayName: 'Package Extension (.vsix)'

  - task: CopyFiles@2
    inputs:
      Contents: '*.vsix'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
    displayName: 'Copy .vsix to Artifact Directory'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'vsix-packages'
      publishLocation: 'Container'
    displayName: 'Publish Pipeline Artifact'

- job: Publish
  dependsOn: Build
  condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'))
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - task: UseNode@1
    inputs:
      version: '20.x'
    displayName: 'Install Node.js'

  - task: DownloadBuildArtifacts@1
    inputs:
      buildType: 'current'
      downloadType: 'single'
      artifactName: 'vsix-packages'
      downloadPath: '$(System.ArtifactsDirectory)'
    displayName: 'Download VSIX packages'

  - task: AzureCLI@2
    displayName: 'Publish to VS Code Marketplace (Secure)'
    inputs:
      azureSubscription: 'SeekyDevOps'
      scriptType: pscore
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        npx @vscode/vsce publish --packagePath $(System.ArtifactsDirectory)/vsix-packages/*.vsix --azure-credential --skip-duplicate
