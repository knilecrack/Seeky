trigger:
  - main
  - master

jobs:
- job: Publish
  strategy:
    matrix:
      Windows:
        imageName: 'windows-latest'
        targetFlag: 'win32-x64'
      Linux:
        imageName: 'ubuntu-latest'
        targetFlag: 'linux-x64'
      MacOS:
        imageName: 'macos-latest'
        targetFlag: 'darwin-x64'
      MacOS_ARM:
        imageName: 'macos-latest'
        targetFlag: 'darwin-arm64'
  pool:
    vmImage: $(imageName)

  steps:
  - task: UseNode@1
    inputs:
      version: '20.x'
    displayName: 'Install Node.js'

  - script: |
      npm ci
    displayName: 'Install dependencies'

  - script: |
      npm run compile
    displayName: 'Run Type Checks'

  - script: |
      npx vsce package --target $(targetFlag)
    displayName: 'Package Extension (.vsix)'

  - task: CopyFiles@2
    inputs:
      Contents: '*.vsix'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
    displayName: 'Copy .vsix to Artifact Directory'

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'vsix-package-$(targetFlag)'
      publishLocation: 'Container'
    displayName: 'Publish Pipeline Artifact'

  - task: AzureCLI@2
    displayName: 'Publish to VS Code Marketplace (Secure)'
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'))
    inputs:
      azureSubscription: 'SeekyDevOps'
      scriptType: pscore
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        npx vsce publish --target $(targetFlag) --azure-credential
