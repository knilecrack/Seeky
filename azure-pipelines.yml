trigger:
  - main
  - master

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x' # Using Node 20 as standard for modern extensions
  displayName: 'Install Node.js'

- script: |
    npm ci
  displayName: 'Install dependencies'

- script: |
    npm run compile
  displayName: 'Run Type Checks'

- script: |
    npx vsce package
  displayName: 'Package Extension (.vsix)'

- task: CopyFiles@2
  inputs:
    Contents: '*.vsix'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
  displayName: 'Copy .vsix to Artifact Directory'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'vsix-package'
    publishLocation: 'Container'
  displayName: 'Publish Pipeline Artifact'

# OPTIONAL: Secure Automated Publishing to the VS Code Marketplace
# Microsoft recommends using Microsoft Entra ID (OIDC Workload Identity Federation)
# instead of long-lived Personal Access Tokens (PATs).
# 
# Prerequisites:
# 1. Create a Service Connection in Azure DevOps linked to a Managed Identity or Service Principal.
# 2. Add that identity to your VS Code Marketplace publisher account with the 'Contributor' role.
# 3. Replace '<YourServiceConnectionName>' below with the name of your service connection.
#

# --- ONE TIME SETUP: GET THE MARKETPLACE ID ---
# 1. Push this code to GitHub so the pipeline runs.
# 2. Open the pipeline logs in Azure DevOps.
# 3. Look at the logs for the "Get identity details" task below.
# 4. Copy the "id" field from the JSON output. 
# 5. Paste THAT ID into the Visual Studio Marketplace to add it as a Contributor.
- task: AzureCLI@2
  displayName: 'Get identity details (One-time setup)'
  inputs:
    azureSubscription: 'SeekyDevOps'
    scriptType: pscore
    scriptLocation: inlineScript
    inlineScript: |
      az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798

- task: AzureCLI@2
  displayName: 'Publish to VS Code Marketplace (Secure)'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  inputs:
    azureSubscription: 'SeekyDevOps'
    scriptType: pscore
    scriptLocation: inlineScript
    addSpnToEnvironment: true
    inlineScript: |
      # vsce automatically detects the Azure CLI environment credentials when using this flag
      npx vsce publish --azure-credential
